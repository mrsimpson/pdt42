    <meta charset="UTF-8" /><script>window.__WORKSPACE__={"name":"Harvest Commons","documents":[{"filePath":"1-exploration/e1-arenas.pdt42.md","title":"Identify the ecosystem and its arenas · Choose the arena to focus on","steps":["E1","E4"],"nodes":[{"kind":"heading","level":1,"text":"Identify the ecosystem and its arenas · Choose the arena to focus on","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-arena-scan","canvas":"arena-scan"},"startLine":4,"endLine":7,"inPdt42Fence":true},{"kind":"prose","text":"","line":9,"renderedHtml":""},{"kind":"heading","level":2,"text":"Regional food system","line":10},{"kind":"prose","text":"","line":11,"renderedHtml":"\u003cp>Around the city, about sixty small farms grow vegetables, fruit and herbs. They sell at weekly\nmarkets, to a regional wholesale market and to a handful of restaurants that call them directly.\nValue is exchanged every day — but through phone calls, market stalls and a wholesaler that\nhides the farms from the kitchens that cook their produce.\u003c/p>\n"},{"kind":"prose","text":"Around the city, about sixty small farms grow vegetables, fruit and herbs. They sell at weekly","line":12,"renderedHtml":""},{"kind":"prose","text":"markets, to a regional wholesale market and to a handful of restaurants that call them directly.","line":13,"renderedHtml":""},{"kind":"prose","text":"Value is exchanged every day — but through phone calls, market stalls and a wholesaler that","line":14,"renderedHtml":""},{"kind":"prose","text":"hides the farms from the kitchens that cook their produce.","line":15,"renderedHtml":""},{"kind":"prose","text":"","line":16,"renderedHtml":""},{"kind":"block","blockType":"ecosystem","attributes":{"id":"eco-food","title":"Regional food system","context":"ecosystem-mobilization"},"startLine":18,"endLine":22,"inPdt42Fence":true},{"kind":"prose","text":"","line":24,"renderedHtml":""},{"kind":"heading","level":2,"text":"Growing and harvesting","line":25},{"kind":"prose","text":"","line":26,"renderedHtml":"\u003cp>Planning crops, growing them and bringing them in. Seasonal and weather-bound; today planned\nagainst last year&#39;s sales rather than against demand.\u003c/p>\n"},{"kind":"prose","text":"Planning crops, growing them and bringing them in. Seasonal and weather-bound; today planned","line":27,"renderedHtml":""},{"kind":"prose","text":"against last year's sales rather than against demand.","line":28,"renderedHtml":""},{"kind":"prose","text":"","line":29,"renderedHtml":""},{"kind":"block","blockType":"arena","attributes":{"id":"ar-growing","title":"Growing and harvesting","outcome":"The right crops are ready at the right time","steps":""},"lists":{"steps":["Plan the crops","Grow","Harvest"]},"startLine":31,"endLine":39,"inPdt42Fence":true},{"kind":"prose","text":"","line":41,"renderedHtml":""},{"kind":"heading","level":2,"text":"Selling the harvest","line":42},{"kind":"prose","text":"","line":43,"renderedHtml":"\u003cp>Finding buyers, agreeing quantities and prices, and getting paid. This is where farms lose most\nvalue: up to a fifth of the harvest is never sold. It is our focus — the cooperative already runs\na market stall and knows both farms and customers, and the only incumbent here is the wholesale\nmarket.\u003c/p>\n"},{"kind":"prose","text":"Finding buyers, agreeing quantities and prices, and getting paid. This is where farms lose most","line":44,"renderedHtml":""},{"kind":"prose","text":"value: up to a fifth of the harvest is never sold. It is our focus — the cooperative already runs","line":45,"renderedHtml":""},{"kind":"prose","text":"a market stall and knows both farms and customers, and the only incumbent here is the wholesale","line":46,"renderedHtml":""},{"kind":"prose","text":"market.","line":47,"renderedHtml":""},{"kind":"prose","text":"","line":48,"renderedHtml":""},{"kind":"block","blockType":"arena","attributes":{"id":"ar-selling","title":"Selling the harvest","outcome":"Produce reaches a kitchen at a fair price before it spoils","after":"ar-growing","focus":"yes","steps":""},"lists":{"steps":["Find buyers","Agree quantities and prices","Deliver","Get paid and get feedback"]},"startLine":50,"endLine":61,"inPdt42Fence":true},{"kind":"prose","text":"","line":63,"renderedHtml":""},{"kind":"heading","level":2,"text":"Getting food to kitchens","line":64},{"kind":"prose","text":"","line":65,"renderedHtml":"\u003cp>Transport from the farm into the city. Every farm drives its own van today; this arena enables\nselling.\u003c/p>\n"},{"kind":"prose","text":"Transport from the farm into the city. Every farm drives its own van today; this arena enables","line":66,"renderedHtml":""},{"kind":"prose","text":"selling.","line":67,"renderedHtml":""},{"kind":"prose","text":"","line":68,"renderedHtml":""},{"kind":"block","blockType":"arena","attributes":{"id":"ar-delivery","title":"Getting food to kitchens","outcome":"Food arrives fresh, on time and without every farm driving into town","enables":"ar-selling"},"startLine":70,"endLine":75,"inPdt42Fence":true},{"kind":"prose","text":"","line":77,"renderedHtml":""},{"kind":"heading","level":2,"text":"Cooking and eating","line":78},{"kind":"prose","text":"","line":79,"renderedHtml":"\u003cp>What restaurants and households do with the food. Enabled by selling; out of our reach for now.\u003c/p>\n"},{"kind":"prose","text":"What restaurants and households do with the food. Enabled by selling; out of our reach for now.","line":80,"renderedHtml":""},{"kind":"prose","text":"","line":81,"renderedHtml":""},{"kind":"block","blockType":"arena","attributes":{"id":"ar-cooking","title":"Cooking and eating","outcome":"Seasonal meals that tell where the food comes from","after":"ar-selling"},"startLine":83,"endLine":88,"inPdt42Fence":true},{"kind":"prose","text":"","line":90,"renderedHtml":""}]},{"filePath":"1-exploration/e2-scan.pdt42.md","title":"Scan the ecosystem","steps":["E2"],"nodes":[{"kind":"heading :"prose","text":"","line":236,"renderedHtml":"\u003cp>Advises the city on its target of 30 % regional food in public canteens by 2030 — and wants\nevidence that local sourcing works.\u003c/p>\n"},{"kind":"prose","text":"Advises the city on its target of 30 % regional food in public canteens by 2030 — and wants","line":237,"renderedHtml":""},{"kind":"prose","text":"evidence that local sourcing works.","line":238,"renderedHtml":""},{"kind":"prose","text":"","line":239,"renderedHtml":""},{"kind":"block","blockType":"entity","attributes":{"id":"e-city","title":"City Food Council","role":"stakeholder","type":"public advisory board"},"startLine":241,"endLine":246,"inPdt42Fence":true},{"kind":"prose","text":"","line":248,"renderedHtml":""},{"kind":"heading","level":2,"text":"Find buyers for the week's harvest","line":249},{"kind":"prose","text":"","line":250,"renderedHtml":"\u003cp>Every Monday farmers call restaurants and the wholesaler to place what they expect to harvest.\nWhatever is left goes to the wholesaler at its price.\u003c/p>\n"},{"kind":"prose","text":"Every Monday farmers call restaurants and the wholesaler to place what they expect to harvest.","line":251,"renderedHtml":""},{"kind":"prose","text":"Whatever is left goes to the wholesaler at its price.","line":252,"renderedHtml":""},{"kind":"prose","text":"","line":253,"renderedHtml":""},{"kind":"block","blockType":"job","attributes":{"id":"j-find-buyers","title":"Find buyers for the week's harvest","arena":"ar-selling","entities":"e-farmers, e-restaurants, e-wholesaler","job-step":"locate"},"startLine":255,"endLine":261,"inPdt42Fence":true},{"kind":"prose","text":"","line":263,"renderedHtml":""},{"kind":"heading","level":2,"text":"Sell at the Saturday market","line":264},{"kind":"prose","text":"","line":265,"renderedHtml":"\u003cp>Farmers and households meet in person. Households love it but cannot plan around it.\u003c/p>\n"},{"kind":"prose","text":"Farmers and households meet in person. Households love it b astructure","relates-to":"j-drive"},"startLine":47,"endLine":53,"inPdt42Fence":true},{"kind":"prose","text":"","line":55,"renderedHtml":""},{"kind":"heading","level":2,"text":"Regional wholesale market","line":56},{"kind":"prose","text":"","line":57,"renderedHtml":"\u003cp>The established buyer of last resort. We do not try to replace it: surplus still goes there, but\nno longer by default.\u003c/p>\n"},{"kind":"prose","text":"The established buyer of last resort. We do not try to replace it: surplus still goes there, but","line":58,"renderedHtml":""},{"kind":"prose","text":"no longer by default.","line":59,"renderedHtml":""},{"kind":"prose","text":"","line":60,"renderedHtml":""},{"kind":"block","blockType":"moat","attributes":{"id":"mo-wholesale","title":"Regional wholesale market","kind":"demand-aggregator","holder":"e-wholesaler","layer":"aggregator","arena":"ar-selling"},"startLine":62,"endLine":69,"inPdt42Fence":true},{"kind":"prose","text":"","line":71,"renderedHtml":""}]},{"filePath":"1-exploration/e5-value-chain.pdt42.md","title":"Map the value chain","steps":["E5"],"nodes":[{"kind":"heading","level":1,"text":"Map the value chain","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The value chain of selling the harvest, from the kitchens&#39; needs down to the vans. Today it is\nC-shaped: the wholesaler sits between farms and kitchens, and farms are perceived as a commodity.\u003c/p>\n"},{"kind":"prose","text":"The value chain of selling the harvest, from the kitchens' needs down to the vans. Today it is","line":3,"renderedHtml":""},{"kind":"prose","text":"C-shaped: the wholesaler sits between farms and kitchens, and farms are perceived as a commodity.","line":4,"renderedHtml":""},{"kind":"prose","text":"","line":5,"renderedHtml":""},{"kind":"block","blockType":"canvas","attributes":{"id":"cv-value-chain","canvas":"wardley-map","of":"ar-selling"},"startLine":7,"endLine":11,"inPdt42Fence":true},{"kind":"prose","text":"","line":13,"renderedHt l","kind":"goods"},"startLine":157,"endLine":164,"inPdt42Fence":true},{"kind":"prose","text":"","line":166,"renderedHtml":""},{"kind":"heading","level":2,"text":"Impact","line":167},{"kind":"prose","text":"","line":168,"renderedHtml":"\u003cp>The cooperative can give the City Food Council what it lacks: evidence that regional sourcing works.\u003c/p>\n"},{"kind":"prose","text":"The cooperative can give the City Food Council what it lacks: evidence that regional sourcing works.","line":169,"renderedHtml":""},{"kind":"prose","text":"","line":170,"renderedHtml":""},{"kind":"block","blockType":"motivation","attributes":{"id":"m-coop-city","from":"e-coop","to":"e-city","gives":"Data on local share and food miles","status":"potential","kind":"data"},"startLine":172,"endLine":179,"inPdt42Fence":true},{"kind":"prose","text":"","line":181,"renderedHtml":""}]},{"filePath":"2-design/d4-relationships.pdt42.md","title":"Choose the core relationships","steps":["D4"],"nodes":[{"kind":"heading","level":1,"text":"Choose the core relationships","line":1},{"kind":"prose","text":"","line":2,"renderedHtml":"\u003cp>The matrix shows most value flowing between farms and the two kinds of kitchens. We design for\nfarmers first — they are the core entity — in two core relationships; couriers enable both.\u003c/p>\n"},{"kind":"prose","text":"The matrix shows most value flowing between farms and the two kinds of kitchens. We design for","line":3,"renderedHtml":""},{"kind":"prose","text":"farmers first — they are the core entity — in two core relationships; couriers enable both.","line":4,"renderedHtml":""},{"kind":"prose","text":"","line":5,"renderedHtml":""},{"kind":"heading","level":2,"text":"Farmer ↔ restaurant","line":6},{"kind":"prose","text":"","line":7,"renderedHtml":"\u003cp>High volume, planned months ahead: the relationship that lets farms sow against demand.\u003c/p>\n"},{"kind":"prose","text":"High volume, planned months ahead: the relationship that lets farms sow against demand.", "text":"Chefs recommend farms to chefs","line":28},{"kind":"prose","text":"","line":29,"renderedHtml":"\u003cp>A chef who credits a farm on the menu is asked by peers where the produce comes from.\u003c/p>\n"},{"kind":"prose","text":"A chef who credits a farm on the menu is asked by peers where the produce comes from.","line":30,"renderedHtml":""},{"kind":"prose","text":"","line":31,"renderedHtml":""},{"kind":"block","blockType":"growth-loop","attributes":{"id":"gl-chef-referrals","title":"Chefs recommend farms to chefs","type":"viral","acquires":"e-restaurants","feeds":"fw-lockin","equation":"new kitchens = active kitchens × referrals per season × conversion","bottleneck":"Referrals per season","cycle-time":"One season","metric":"Referred kitchens per season"},"startLine":33,"endLine":43,"inPdt42Fence":true},{"kind":"prose","text":"","line":45,"renderedHtml":""}]}],"elements":[{"id":"eco-food","title":"Regional food system","context":"ecosystem-mobilization","kind":"ecosystem","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":18,"heading":"Regional food system","prose":"\nAround the city, about sixty small farms grow vegetables, fruit and herbs. They sell at weekly\nmarkets, to a regional wholesale market and to a handful of restaurants that call them directly.\nValue is exchanged every day — but through phone calls, market stalls and a wholesaler that\nhides the farms from the kitchens that cook their produce.\n"}},{"id":"ar-growing","title":"Growing and harvesting","outcome":"The right crops are ready at the right time","after":[],"enables":[],"steps":["Plan the crops","Grow","Harvest"],"kind":"arena","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":31,"heading":"Growing and harvesting","prose":"\nPlanning crops, growing them and bringing them in. Seasonal and weather-bound; today planned\nagainst last year's sales rather than against demand.\n"}},{"id":"ar-selling","title":"Selling the harvest","outcome":"Produce reaches a kitchen at a fair price before it spoils","after":["ar-growing"],"enables":[],"focus":true,"steps":["Find buyers","Agree quantities and prices","Deliver","Get paid and get feedback"],"kind":"arena","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":50,"heading":"Selling the harvest","prose":"\nFinding buyers, agreeing quantities and prices, and getting paid. This is where farms lose most\nvalue: up to a fifth of the harvest is never sold. It is our focus — the cooperative already runs\na market stall and knows both farms and customers, and the only incumbent here is the wholesale\nmarket.\n"}},{"id":"ar-delivery","title":"Getting food to kitchens","outcome":"Food arrives fresh, on time and without every farm driving into town","after":[],"enables":["ar-selling"],"steps":[],"kind":"arena","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":70,"heading":"Getting food to kitchens","prose":"\nTransport from the farm into the city. Every farm drives its own van today; this arena enables\nselling.\n"}},{"id":"ar-cooking","title":"Cooking and eating","outcome":"Seasonal meals that tell where the food comes from","after":["ar-selling"],"enables":[],"steps":[],"kind":"arena","loc":{"file":"1-exploration/e1-arenas.pdt42.md","line":83,"heading":"Cooking and eating","prose":"\nWhat restaurants and households do with the food. Enabled by selling; out of our reach for now.\n"}},{"id":"e-coop","title":"Harvest Commons Cooperative","role":"owner","type":"cooperative owned by its farms","clusters":[],"context":[],"assets":[],"capabilities":[],"potential":[],"goals":[],"pressures":[],"convenience-gains":[],"reach-gains":[],"value-gains":[],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":16,"heading":"Harvest Commons Cooperative","prose":"\nThe cooperative runs the platform on behalf of its member farms: two staff, a monthly members'\nassembly, and a thin commission to live on.\n"}},{"id":"e-farmers","title":"Small-scale farmers","role":"peer-producer","layer":"long-tail","type":"family businesses","clusters":["Vegetable growers","Orchards","Herb growers"],"context":[],"assets":["Land within an hour of the city","Heirloom varieties"],"capabilities":["Deep knowledge of soil and seasons"],"potential":["Could grow to order for named kitchens"],"goals":["A predictable income before the season starts"],"pressures":["Volatile demand, up to 20 % unsold","Rising fuel and labour costs"],"convenience-gains":["Selling as simple as loading a crate"],"reach-gains":["Kitchens that value their varieties"],"value-gains":["Fair prices, paid on time","Recognition for their craft"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":30,"heading":"Small-scale farmers","prose":"\nFamily farms of two to twenty hectares within sixty kilometres. They grow well; selling is what\ncosts them — time on the phone, trips into town, and the fifth of the harvest nobody buys.\n"}},{"id":"e-artisans","title":"Food artisans","role":"peer-producer","layer":"long-tail","type":"micro-businesses","clusters":["Micro-bakeries","Small dairies","Preserve makers"],"context":[],"assets":[],"capabilities":["Turning surplus into products that keep"],"potential":[],"goals":["Steady sales beyond their own shop"],"pressures":[],"convenience-gains":["A shelf in every order without a shop of their own"],"reach-gains":[],"value-gains":["Surplus produce at fair prices"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":76,"heading":"Food artisans","prose":"\nBakers, cheesemakers and preservers who add variety to every order and buy surplus that would\notherwise spoil.\n"}},{"id":"e-restaurants","title":"Independent restaurants","role":"peer-consumer","layer":"long-tail","type":"chef-owned SMBs, 30–80 covers","clusters":["Bistros","Fine dining","Canteens run by chefs"],"context":[],"assets":["Bulk demand planned months ahead"],"capabilities":[],"potential":["Could co-plan crops with farms"],"goals":["Signature dishes built on local produce"],"pressures":["Wholesalers offer little local produce","Menus depend on unreliable supply"],"convenience-gains":["One order for many farms"],"reach-gains":["A direct line to the grower"],"value-gains":["A story guests remember"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":111,"heading":"Independent restaurants","prose":"\nChef-owned restaurants that write their menu around the season and can commit to volumes months\nahead — if the supply is reliable.\n"}},{"id":"e-households","title":"Neighbourhood households","role":"peer-consumer","layer":"long-tail","type":"individuals","clusters":["Families","Flat shares"],"context":[],"assets":[],"capabilities":[],"potential":["Could commit to a season and bring their neighbours"],"goals":["Cook fresh food three to five times a week"],"pressures":["Little time for shopping","Food prices rising faster than income"],"convenience-gains":["Pick-up as easy as the corner shop"],"reach-gains":["Farms they can visit"],"value-gains":["Fair price without a market trip"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":153,"heading":"Neighbourhood households","prose":"\nFamilies and flat shares who care where food comes from but shop at the supermarket because it is\nconvenient.\n"}},{"id":"e-couriers","title":"Cargo-bike couriers","role":"partner","layer":"infrastructure","type":"worker-owned collective","clusters":[],"context":[],"assets":["Zero-emission last-mile fleet"],"capabilities":["Route planning inside the city ring"],"potential":[],"goals":["Regular weekly volumes"],"pressures":["Parcel volumes drop outside the holidays"],"convenience-gains":["Planned volumes instead of last-minute calls"],"reach-gains":[],"value-gains":["Steady income"],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":192,"heading":"Cargo-bike couriers","prose":"\nA worker-owned courier collective that already delivers parcels within the city ring and wants\nregular routes.\n"}},{"id":"e-wholesaler","title":"Regional wholesale market","role":"stakeholder","layer":"aggregator","clusters":[],"context":[],"assets":[],"capabilities":[],"potential":[],"goals":[],"pressures":[],"convenience-gains":[],"reach-gains":[],"value-gains":[],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":227,"heading":"Regional wholesale market","prose":"\nThe established buyer of last resort. In the platform it stays a stakeholder: the outlet for\nsurplus.\n"}},{"id":"e-city","title":"City Food Council","role":"stakeholder","type":"public advisory board","clusters":[],"context":[],"assets":[],"capabilities":[],"potential":[],"goals":[],"pressures":[],"convenience-gains":[],"reach-gains":[],"value-gains":[],"kind":"entity","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":241,"heading":"City Food Council","prose":"\nAdvises the city on its target of 30 % regional food in public canteens by 2030 — and wants\nevidence that local sourcing works.\n"}},{"id":"j-find-buyers","title":"Find buyers for the week's harvest","arena":"ar-selling","entities":["e-farmers","e-restaurants","e-wholesaler"],"job-step":"locate","kind":"job","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":255,"heading":"Find buyers for the week's harvest","prose":"\nEvery Monday farmers call restaurants and the wholesaler to place what they expect to harvest.\nWhatever is left goes to the wholesaler at its price.\n"}},{"id":"j-market","title":"Sell at the Saturday market","arena":"ar-selling","entities":["e-farmers","e-households"],"job-step":"execute","kind":"job","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":269,"heading":"Sell at the Saturday market","prose":"\nFarmers and households meet in person. Households love it but cannot plan around it.\n"}},{"id":"j-drive","title":"Drive produce into town","arena":"ar-delivery","entities":["e-farmers","e-restaurants"],"job-step":"execute","kind":"job","loc":{"file":"1-exploration/e2-scan.pdt42.md","line":283,"heading":"Drive produce into town","prose":"\nEach farm loads its own van for a handful of deliveries.\n"}},{"id":"as-customers","title":"Saturday market customer base","vrio":"vrio","layer":"long-tail","relates-to":["e-households","j-market"],"kind":"asset","loc":{"file":"1-exploration/e3-assets-moats.pdt42.md","line":16,"heading":"Saturday market customer base","prose":"\nEight years of market days have built a list of 2,000 households who ask for the farms by name.\nValuable, rare, hard to copy — and the cooperative is organised to use it.\n"}},{"id":"as-trust","title":"Trust of the farming community","vrio":"vrio","layer":"aggregator","relates-to":["e-farmers"],"kind":"asset","loc":{"file":"1-exploration/e3-assets-moats.pdt42.md","line":31,"heading":"Trust of the farming community","prose":"\nThe cooperative is run by farmers. No outside player would get fourteen farms to share their\nharvest plans.\n"}},{"id":"as-depot","title":"Refrigerated depot","vrio":"vr","layer":"infrastructure","relates-to":["j-drive"],"kind":"asset","loc":{"file":"1-exploration/e3-assets-moats.pdt42.md","line":47,"heading":"Refrigerated depot","prose":"\nA shared cold room at the edge of town. Useful, but others could rent one tomorrow.\n\n"}},{"id":"mo-wholesale","title":"Regional wholesale market","holder":"e-wholesaler","layer":"aggregator","arena":"ar-selling","category":"demand-aggregator","kind":"moat","loc":{"file":"1-exploration/e3-assets-moats.pdt42.md","line":62,"heading":"Regional wholesale market","prose":"\nThe established buyer of last resort. We do not try to replace it: surplus still goes there, but\nno longer by default.\n"}},{"id":"c-menu","title":"Seasonal menu","arena":"ar-selling","visibility":95,"evolution":"custom","needs":["c-produce","c-ordering"],"entity":"e-restaurants","kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":19,"heading":"Seasonal menu","prose":"\nRestaurants need produce that makes a menu worth coming back for.\n"}},{"id":"c-fresh-food","title":"Fresh food at home","arena":"ar-selling","visibility":90,"evolution":"product","needs":["c-produce","c-ordering"],"entity":"e-households","kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":35,"heading":"Fresh food at home","prose":"\nHouseholds want to cook what is in season without planning their week around a market.\n"}},{"id":"c-produce","title":"Farm produce","arena":"ar-selling","visibility":45,"evolution":"commodity","target":"custom","needs":["c-delivery"],"entity":"e-farmers","kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":52,"heading":"Farm produce","prose":"\nToday bought as anonymous boxes of vegetables. After the plays, each farm's produce is visible and\nchosen for its varieties.\n"}},{"id":"c-ordering","title":"Ordering and pricing","arena":"ar-selling","visibility":60,"evolution":"custom","target":"product","needs":["c-wholesale"],"kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":69,"heading":"Ordering and pricing","prose":"\nPhone calls and haggling today; a standard pre-order after the plays.\n"}},{"id":"c-wholesale","title":"Wholesale trading","arena":"ar-selling","visibility":35,"evolution":"product","needs":[],"entity":"e-wholesaler","kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":85,"heading":"Wholesale trading","prose":"\nThe wholesaler's price list, which sets the floor for everyone.\n"}},{"id":"c-delivery","title":"Last-mile delivery","arena":"ar-selling","visibility":25,"evolution":"custom","target":"product","needs":["c-vans"],"kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":100,"heading":"Last-mile delivery","prose":"\nEvery farm with its own van today; shared routes after the plays.\n"}},{"id":"c-vans","title":"Vans and fuel","arena":"ar-selling","visibility":10,"evolution":"commodity","needs":[],"kind":"component","loc":{"file":"1-exploration/e5-value-chain.pdt42.md","line":116,"heading":"Vans and fuel","prose":"\nA commodity.\n"}},{"id":"pl-producers-up","play":"pp2","arena":"ar-selling","affects":["c-produce"],"insight":"Treat farmers as users with their own storefront; kitchens choose farms, not boxes","kind":"play","loc":{"file":"1-exploration/e6-plays.pdt42.md","line":16,"heading":"Farms on top of the chain","prose":"\nFarmers are hidden behind the wholesaler and perceived as a commodity. Bringing them to the top\nof the chain — visible, with their varieties and their story — is the central move.\n"}},{"id":"pl-standard-order","play":"pp3","arena":"ar-selling","affects":["c-ordering"],"insight":"Standardise the pre-order and the weekly availability list; that is the transaction to build","kind":"play","loc":{"file":"1-exploration/e6-plays.pdt42.md","line":31,"heading":"A standard pre-order","prose":"\nEvery deal is negotiated by phone. A standard pre-order — variety, kilos, week, price band — lets\nany kitchen commit to any farm in minutes.\n"}},{"id":"pl-aggregate","play":"pp6","arena":"ar-selling","affects":["c-wholesale","c-delivery"],"insight":"Pool orders per week and route; the wholesaler becomes the outlet for surplus only","kind":"play","loc":{"file":"1-exploration/e6-plays.pdt42.md","line":46,"heading":"Aggregate the kitchens' demand","prose":"\nIndividually, restaurants and households are too small to plan for. Aggregated per week and per\nvariety, they become a demand farms can sow against.\n"}},{"id":"sc-hub-hosts","title":"Hub hosts become a profession","pattern":"e4","arena":"ar-selling","impact":"Households evolve into hosts; delivery cost per box drops as hubs multiply","kind":"scenario","loc":{"file":"1-exploration/e7-brief.pdt42.md","line":16,"heading":"Hub hosts become a profession","prose":"\nIf pick-up points in cafés and bakeries spread, hosting a hub could become a small income for\nengaged households — a new role in the ecosystem.\n"}},{"id":"br-main","title":"Planned harvests for local kitchens","arena":"ar-selling","entities":["e-farmers","e-restaurants","e-households","e-couriers"],"standardize":["Weekly availability list","Seasonal pre-order","Shared delivery booking"],"product-side":["Farm storefront and harvest forecast","Invoicing and payouts"],"moats":["mo-wholesale"],"kind":"brief","loc":{"file":"1-exploration/e7-brief.pdt42.md","line":32,"heading":"Planned harvests for local kitchens","prose":"\nThe platformization space is the selling arena, around two core relationships: farms with\nrestaurants (planned, high volume) and farms with households (weekly boxes). Couriers are an\nancillary but necessary role.\n"}},{"id":"platform-harvest","title":"Harvest Commons","ecosystem":"eco-food","brief":"br-main","narrative":"Food from the farms around the city becomes the easy default for every kitchen","owners":["e-coop"],"core-entity":"e-farmers","core-value":"A harvest sold before it is sown","ancillary-values":["Fresh, traceable food without a market trip","Delivery without driving into town"],"infrastructure":["Harvest app","Refrigerated depot","Neighbourhood pick-up hubs"],"kind":"platform","loc":{"file":"2-design/d1-ecosystem.pdt42.md","line":20,"heading":"Harvest Commons","prose":"\nHarvest Commons turns guesses into commitments: kitchens commit to what they will cook, farms sow\nagainst it, and the cooperative bundles delivery so no farm drives alone. Its promise to every\nmember is simple — selling gets easier, and you learn faster inside than outside.\n"}},{"id":"m-farmers-restaurants","from":"e-farmers","to":"e-restaurants","gives":"Heirloom varieties grown to order","status":"potential","category":"goods","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":20,"heading":"Heirloom varieties grown to order","prose":"\nFarmers can grow what a chef plans a menu around — varieties no wholesaler stocks.\n"}},{"id":"m-restaurants-farmers","from":"e-restaurants","to":"e-farmers","gives":"Volumes committed months ahead","status":"potential","category":"money","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":35,"heading":"Volumes committed months ahead","prose":"\nRestaurants can commit to volumes before the season starts, so farmers plant against demand.\n"}},{"id":"m-restaurants-farmers-rep","from":"e-restaurants","to":"e-farmers","gives":"The farm's name on the menu","status":"potential","category":"reputation","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":50,"heading":"The farm's name on the menu","prose":"\nA restaurant that names its farm on the menu gives the farm a reputation it cannot buy.\n"}},{"id":"m-farmers-households","from":"e-farmers","to":"e-households","gives":"Vegetables picked the day before","status":"current","category":"goods","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":65,"heading":"Vegetables picked the day before","prose":"\nHouseholds get what supermarkets cannot offer: vegetables picked the day before.\n"}},{"id":"m-households-farmers","from":"e-households","to":"e-farmers","gives":"A season-long subscription to plan against","status":"potential","category":"money","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":80,"heading":"A season-long subscription","prose":"\nA household that subscribes for a season gives a farm a demand it can plan against.\n"}},{"id":"m-households-feedback","from":"e-households","to":"e-farmers","gives":"Ratings and recipes for every box","status":"potential","category":"feedback","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":95,"heading":"Ratings and recipes","prose":"\nHouseholds rate every box and share recipes — feedback that tells farmers what to grow.\n"}},{"id":"m-couriers-farmers","from":"e-couriers","to":"e-farmers","gives":"Delivery without driving into town","status":"potential","category":"services","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":112,"heading":"Delivery without driving into town","prose":"\nCouriers spare farmers the drive into town during the busiest weeks.\n"}},{"id":"m-farmers-couriers","from":"e-farmers","to":"e-couriers","gives":"Weekly routes booked in advance","status":"potential","category":"money","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":127,"heading":"Routes booked in advance","prose":"\nFarmers can book weekly routes in advance, which gives couriers a steady income.\n"}},{"id":"m-artisans-households","from":"e-artisans","to":"e-households","gives":"Bread and cheese in the same order","status":"current","category":"goods","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":142,"heading":"Bread and cheese in the same order","prose":"\nArtisans add bread and cheese to the same order, so households buy one box instead of three.\n"}},{"id":"m-farmers-artisans","from":"e-farmers","to":"e-artisans","gives":"Surplus produce at fair prices","status":"potential","category":"goods","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":157,"heading":"Surplus produce at fair prices","prose":"\nArtisans take the farms' surplus at fair prices and turn it into goods that keep.\n"}},{"id":"m-coop-city","from":"e-coop","to":"e-city","gives":"Data on local share and food miles","status":"potential","category":"data","kind":"motivation","loc":{"file":"2-design/d3-motivations.pdt42.md","line":172,"heading":"Impact","prose":"\nThe cooperative can give the City Food Council what it lacks: evidence that regional sourcing works.\n"}},{"id":"r-farmer-restaurant","title":"Farmer ↔ restaurant","between":["e-farmers","e-restaurants"],"core":true,"kind":"relationship","loc":{"file":"2-design/d4-relationships.pdt42.md","line":11,"heading":"Farmer ↔ restaurant","prose":"\nHigh volume, planned months ahead: the relationship that lets farms sow against demand.\n"}},{"id":"r-farmer-household","title":"Farmer ↔ household","between":["e-farmers","e-households"],"core":true,"kind":"relationship","loc":{"file":"2-design/d4-relationships.pdt42.md","line":24,"heading":"Farmer ↔ household","prose":"\nWeekly boxes: smaller volumes but many more people, and the cooperative's existing customers.\n"}},{"id":"r-farmer-courier","title":"Farmer ↔ courier","between":["e-farmers","e-couriers"],"kind":"relationship","loc":{"file":"2-design/d4-relationships.pdt42.md","line":37,"heading":"Farmer ↔ courier","prose":"\nNot a core relationship, but the one that removes the van from every farm.\n"}},{"id":"ch-app","title":"Harvest app","medium":"digital","components":["Weekly availability list","Standard pre-order contract","Shared route booking","Ratings after every delivery"],"improvement":"A pre-order takes two minutes instead of a round of phone calls, and the price band is known upfront","kind":"channel","loc":{"file":"2-design/d5-transactions.pdt42.md","line":11,"heading":"Harvest app","prose":"\nThe web app where farms publish availability, kitchens pre-order and couriers see their routes.\nIts real job is to replace phone calls and haggling with three standard forms.\n"}},{"id":"ch-hubs","title":"Neighbourhood hubs","medium":"physical","components":["Refrigerated shelves","Pick-up codes"],"improvement":"Households collect on their way home; couriers deliver ten boxes to one stop instead of ten doors","kind":"channel","loc":{"file":"2-design/d5-transactions.pdt42.md","line":30,"heading":"Neighbourhood hubs","prose":"\nPick-up shelves in cafés and bakeries, refrigerated where needed. The weekly box (`x-weekly-box`)\nis collected here.\n"}},{"id":"t-share-menus","title":"Share menu plans","relationship":"r-farmer-restaurant","from":"e-restaurants","to":"e-farmers","direction":"two-way","value-unit":"Dishes planned per season","happening":false,"channel":"ch-app","motivation":"m-farmers-restaurants","category":"knowledge","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":56,"heading":"Share menu plans","prose":"\nChefs share the dishes they plan for next season; farms answer with what will be at its best.\n"}},{"id":"t-preorder","title":"Pre-order the season","relationship":"r-farmer-restaurant","from":"e-restaurants","to":"e-farmers","value-unit":"Committed kilos per variety and week","happening":false,"channel":"ch-app","motivation":"m-restaurants-farmers","job":"j-find-buyers","category":"money","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":76,"heading":"Pre-order the season","prose":"\nRestaurants commit to kilos per variety and week, within a price band.\n"}},{"id":"t-deliver-restaurant","title":"Deliver the weekly order","relationship":"r-farmer-restaurant","from":"e-farmers","to":"e-restaurants","value-unit":"Crates delivered per week","happening":true,"channel":"ch-app","job":"j-drive","category":"goods","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":96,"heading":"Deliver the weekly order","prose":"\nAlready happening for a few chefs — by van, by phone, on the farm's own schedule.\n"}},{"id":"t-credit-farm","title":"Credit the farm on the menu","relationship":"r-farmer-restaurant","from":"e-restaurants","to":"e-farmers","value-unit":"Menu mentions and delivery ratings","happening":false,"channel":"ch-app","motivation":"m-restaurants-farmers-rep","category":"reputation","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":115,"heading":"Credit the farm","prose":"\nThe farm's name on the menu, and a rating after every delivery.\n"}},{"id":"t-publish-harvest","title":"Publish the harvest forecast","relationship":"r-farmer-household","from":"e-farmers","to":"e-households","value-unit":"Kilos available per variety this week","happening":false,"channel":"ch-app","category":"data","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":144,"heading":"Publish the harvest forecast","prose":"\nEvery Monday each farm posts what it expects to harvest that week.\n"}},{"id":"t-subscribe","title":"Subscribe to a weekly box","relationship":"r-farmer-household","from":"e-households","to":"e-farmers","value-unit":"Monthly box subscription","happening":false,"channel":"ch-app","motivation":"m-households-farmers","category":"money","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":162,"heading":"Subscribe to a weekly box","prose":"\nHouseholds pay monthly for a box of a chosen size.\n"}},{"id":"t-pickup","title":"Pick up the box at a hub","relationship":"r-farmer-household","from":"e-farmers","to":"e-households","value-unit":"One box per week","happening":false,"channel":"ch-hubs","motivation":"m-farmers-households","job":"j-market","category":"goods","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":181,"heading":"Pick up the box","prose":"\nHouseholds collect on their way home from a shelf in a café or bakery.\n"}},{"id":"t-rate-box","title":"Rate the box and share a recipe","relationship":"r-farmer-household","from":"e-households","to":"e-farmers","value-unit":"Rating and recipe per box","happening":false,"channel":"ch-app","motivation":"m-households-feedback","category":"feedback","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":201,"heading":"Rate the box","prose":"\nHouseholds rate each box and share how they cooked it — the farms' most valuable feedback.\n"}},{"id":"t-book-route","title":"Book a slot on the shared route","relationship":"r-farmer-courier","from":"e-farmers","to":"e-couriers","value-unit":"Delivery slots per week","happening":false,"channel":"ch-app","motivation":"m-farmers-couriers","category":"money","kind":"transaction","loc":{"file":"2-design/d5-transactions.pdt42.md","line":230,"heading":"Book a shared route","prose":"\nFarms book a slot on the day's route instead of driving themselves.\n"}},{"id":"le-farmers","entity":"e-farmers","entry":["Invited by a member farm","Met at the Saturday market"],"onboarding":["Publishing a first availability list"],"
