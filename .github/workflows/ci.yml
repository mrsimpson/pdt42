name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Validate the example
        run: pnpm run validate:example

      - name: Cache build artifacts
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            packages/cli/dist
            packages/core/dist
          key: build-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'pnpm-lock.yaml') }}

  # Publishes @pdt42/cli to npm with trusted publishing (OIDC, no token) and creates the GitHub
  # release. semantic-release derives the version from the conventional commits since the last
  # release tag; nothing is published when no commit asks for a release.
  release:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    # Also on a manual run (Actions → CI → Run workflow on main), e.g. after a push that skipped CI.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # No persisted GITHUB_TOKEN: semantic-release authenticates on its own, and the version
      # sync must push with the app token below, not with GITHUB_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.34.6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build artifacts
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            packages/cli/dist
            packages/core/dist
          key: build-${{ hashFiles('packages/*/src/**', 'packages/*/package.json', 'pnpm-lock.yaml') }}

      - name: Build (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm run build

      - name: Check (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm run check

      - name: Test (cache miss fallback)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm test

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Write the released version back to main. This cannot be a separate workflow triggered by
      # the release: GitHub starts no workflows for events created with GITHUB_TOKEN. main is
      # protected, so the push uses the GitHub App allowed to bypass it (variable
      # VERSION_BUMPER_APPID, secret VERSION_BUMPER_SECRET).
      - name: Generate GitHub App token
        id: app-token
        if: vars.VERSION_BUMPER_APPID != ''
        uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2
        with:
          app_id: ${{ vars.VERSION_BUMPER_APPID }}
          private_key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - name: Sync the released version to main
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet -- packages/cli/package.json; then
            echo "No release, nothing to sync."
            exit 0
          fi
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add packages/cli/package.json CHANGELOG.md
          git commit -m "chore(release): $VERSION [skip ci]"
          git pull --rebase origin main
          git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
